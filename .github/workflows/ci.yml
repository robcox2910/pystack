name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Clone sibling projects
        run: |
          cd ..
          for r in py-os:os_learning pebble-lang:pebble-lang pydb:pydb \
                   pyweb:pyweb pygit:pygit pycrypt:pycrypt pynet:pynet \
                   pysearch:pysearch pymq:pymq pykv:pykv pydoc-db:pydocdb \
                   pygraphdb:pygraphdb pytsdb:pytsdb pyvecdb:pyvecdb \
                   pycoldb:pycoldb pyllm:pyllm; do
            git clone --depth 1 "https://github.com/robcox2910/${r%%:*}.git" "${r##*:}"
          done

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

      - name: Run pyright
        run: uv run pyright src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Clone sibling projects
        run: |
          cd ..
          for r in py-os:os_learning pebble-lang:pebble-lang pydb:pydb \
                   pyweb:pyweb pygit:pygit pycrypt:pycrypt pynet:pynet \
                   pysearch:pysearch pymq:pymq pykv:pykv pydoc-db:pydocdb \
                   pygraphdb:pygraphdb pytsdb:pytsdb pyvecdb:pyvecdb \
                   pycoldb:pycoldb pyllm:pyllm; do
            git clone --depth 1 "https://github.com/robcox2910/${r%%:*}.git" "${r##*:}"
          done

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov

  security:
    runs-on: ubuntu-latest
    # Advisory only: surfaces CVEs without blocking merges on upstream/transitive
    # vulnerabilities the project can't fix (e.g. a new CVE in pip or pytest).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Clone sibling projects
        run: |
          cd ..
          for r in py-os:os_learning pebble-lang:pebble-lang pydb:pydb \
                   pyweb:pyweb pygit:pygit pycrypt:pycrypt pynet:pynet \
                   pysearch:pysearch pymq:pymq pykv:pykv pydoc-db:pydocdb \
                   pygraphdb:pygraphdb pytsdb:pytsdb pyvecdb:pyvecdb \
                   pycoldb:pycoldb pyllm:pyllm; do
            git clone --depth 1 "https://github.com/robcox2910/${r%%:*}.git" "${r##*:}"
          done

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run security checks (advisory)
        run: uv run pip-audit --skip-editable
